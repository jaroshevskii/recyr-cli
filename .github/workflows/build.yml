name: Build and Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate release build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Cache .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build
          key: build-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: build-release-${{ runner.os }}-
      - name: Validate Swift build
        run: swift build -c release

  build-macOS:
    name: Build macOS binary
    runs-on: macos-latest
    needs: validate-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Cache .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build
          key: build-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: build-release-${{ runner.os }}-
      - name: Build macOS binary
        run: |
          swift build -c release
          mkdir -p dist
          cp .build/release/RecyrCLI dist/recyr-macos
      - name: Upload macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recyr-macos
          path: dist/recyr-macos

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-macOS
    permissions:
      contents: write
    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recyr-macos
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/recyr-macos
          generate_release_notes: true
